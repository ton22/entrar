name: Automação de Loterias - Bolão da Sorte

on:
  schedule:
    # Roda todos os dias às 21:15, 22:15 e 23:15 (Horário de Brasília)
    # Em UTC: 00:15, 01:15 e 02:15
    - cron: '15 0,1,2,3,14,15,16 * * *'
    
  workflow_dispatch: 

jobs:
  atualizar_banco:
    runs-on: ubuntu-latest
    steps:
      # ========================================================
      # 1. MEGA-SENA
      # ========================================================
      - name: Atualizar Mega-Sena e Notificar
        run: |
          CONCURSO_VELHO=$(curl -s "${{ vars.SUPABASE_URL }}/rest/v1/resultados_loterias?select=concurso,loteria&order=id.desc&limit=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | \
            jq -r '[.[] | select(.loteria // "" | ascii_downcase | contains("mega"))] | .[0].concurso // empty')

          curl -s -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/obter_loterias_v6_producao" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_loteria": "megasena"}'

          CONCURSO_NOVO=$(curl -s "${{ vars.SUPABASE_URL }}/rest/v1/resultados_loterias?select=concurso,loteria&order=id.desc&limit=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | \
            jq -r '[.[] | select(.loteria // "" | ascii_downcase | contains("mega"))] | .[0].concurso // empty')

          echo "Mega-Sena: Anterior=$CONCURSO_VELHO | Atual=$CONCURSO_NOVO"

          if [ -n "$CONCURSO_NOVO" ] && [ "$CONCURSO_NOVO" != "$CONCURSO_VELHO" ]; then
            TEM_BOLAO=$(curl -s "${{ vars.SUPABASE_URL }}/rest/v1/pools?select=id&modality=ilike.*mega*&status=in.(READY_FOR_DRAW,WAITING_PAYMENTS)&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | jq 'length')

            if [ "$TEM_BOLAO" -gt 0 ]; then
              echo "Novo concurso apurado com bolões ativos! Disparando push para resultado_megasena..."
              curl -s -X POST "${{ vars.SUPABASE_URL }}/functions/v1/send-push-notification" \
                -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                -H "Content-Type: application/json" \
                -d '{
                  "topic": "resultado_megasena",
                  "title": "🎉 Resultado Oficial Mega-Sena!",
                  "body": "O resultado do Concurso '"$CONCURSO_NOVO"' foi divulgado pela Caixa!",
                  "data": {
                    "type": "RESULTADO_OFICIAL",
                    "loteria": "MEGA_SENA",
                    "concurso": "'"$CONCURSO_NOVO"'"
                  }
                }'
            else
              echo "Concurso atualizado, mas nenhum bolão ativo de Mega-Sena encontrado. Push omitido."
            fi
          fi

      # ========================================================
      # 2. LOTOFÁCIL
      # ========================================================
      - name: Atualizar Lotofácil e Notificar
        run: |
          CONCURSO_VELHO=$(curl -s "${{ vars.SUPABASE_URL }}/rest/v1/resultados_loterias?select=concurso,loteria&order=id.desc&limit=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | \
            jq -r '[.[] | select(.loteria // "" | ascii_downcase | contains("facil"))] | .[0].concurso // empty')

          curl -s -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/obter_loterias_v6_producao" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
