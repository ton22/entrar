          CONCURSO_VELHO=$(curl -s "${{ vars.SUPABASE_URL }}/rest/v1/resultados_loterias?select=concurso,loteria&order=id.desc&limit=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | \
            jq -r '[.[] | select(.loteria // "" | ascii_downcase | contains("facil"))] | .[0].concurso // empty')

          curl -s -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/obter_loterias_v6_producao" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_loteria": "lotofacil"}'

          CONCURSO_NOVO=$(curl -s "${{ vars.SUPABASE_URL }}/rest/v1/resultados_loterias?select=concurso,loteria&order=id.desc&limit=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
